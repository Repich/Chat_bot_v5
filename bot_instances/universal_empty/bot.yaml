bot:
  id: universal_empty
  name: WIICON ChatBot 5 Universal Empty
  domain_label: неизвестная база 1С
  answer_style: business_short
  forbidden_write_operations: true
  domain_hint_packs:
    - one_c_standard

baseline:
  general_markers:
    - привет
    - здравств
    - добрый день
    - кто ты
    - что ты
    - представься
    - что умеешь
    - что можешь
    - возможности
  data_markers:
    - покажи
    - найди
    - сколько
    - остат
    - документ
    - справочник
    - регистр
    - номенклатур
    - контрагент
    - клиент
    - поставщик
  weather_markers:
    - погода
    - температура
    - дожд
    - снег

answers:
  intro: Я WIICON ChatBot 5, универсальный агент для работы с неизвестной конфигурацией 1С через MCP. Сначала ищу метаданные, затем строю read-only запросы и сохраняю пригодные навыки.
  capabilities: Умею искать структуру неизвестной конфигурации 1С, выполнять read-only запросы через MCP, формировать ответы и сохранять успешные обобщаемые навыки для повторного использования.
  default_general: Я универсальный агент WIICON ChatBot 5 для неизвестной базы 1С. Работаю с метаданными, MCP-запросами и диагностируемыми навыками получения данных.
  out_of_scope_weather: Это вне моей зоны: я работаю с данными 1С. По погоде лучше познакомлю с отличным синоптиком.
  out_of_scope_default: Это вне моей зоны: я работаю с данными 1С, MCP и диагностикой связанных запросов.
